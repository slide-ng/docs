@if (isExternal()) {
  <a
    [href]="href()"
    target="_blank"
    rel="noopener noreferrer"
    class="group inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 text-sm font-medium text-zinc-900 dark:text-zinc-100 no-underline transition-colors hover:border-[color:var(--accent)] hover:text-[color:var(--accent-strong)]"
  >
    <span>{{ title() }}</span>
    <svg
      [lucideIcon]="externalIcon"
      class="size-3.5 opacity-50 group-hover:opacity-100 transition-opacity"
      aria-hidden="true"
    ></svg>
  </a>
} @else {
  <a
    [routerLink]="route()"
    class="group inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 text-sm font-medium text-zinc-900 dark:text-zinc-100 no-underline transition-colors hover:border-[color:var(--accent)] hover:text-[color:var(--accent-strong)]"
  >
    <span>{{ title() }}</span>
    <svg
      [lucideIcon]="internalIcon"
      class="size-3.5 opacity-50 transition-all group-hover:opacity-100 group-hover:translate-x-0.5"
      aria-hidden="true"
    ></svg>
  </a>
}
