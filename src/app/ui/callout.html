@switch (type()) {
  @case ('tip') {
    <div [class]="box + ' border-l-[color:var(--accent)]'">
      <ng-container *ngTemplateOutlet="body"></ng-container>
    </div>
  }
  @case ('success') {
    <div [class]="box + ' border-l-emerald-500'">
      <ng-container *ngTemplateOutlet="body"></ng-container>
    </div>
  }
  @case ('warning') {
    <div [class]="box + ' border-l-amber-500'">
      <ng-container *ngTemplateOutlet="body"></ng-container>
    </div>
  }
  @case ('danger') {
    <div [class]="box + ' border-l-red-500'">
      <ng-container *ngTemplateOutlet="body"></ng-container>
    </div>
  }
  @default {
    <div [class]="box + ' border-l-blue-500'">
      <ng-container *ngTemplateOutlet="body"></ng-container>
    </div>
  }
}

<ng-template #body>
  @if (title()) {
    <p class="font-semibold text-sm mt-0 mb-2 text-zinc-900 dark:text-zinc-100">
      {{ title() }}
    </p>
  }
  <div
    class="text-sm text-zinc-700 dark:text-brand-muted-dark [&>*:last-child]:mb-0 [&>*:first-child]:mt-0"
  >
    <ng-content></ng-content>
  </div>
</ng-template>
