<nav aria-label="Documentation" class="flex flex-col gap-4 text-sm">
  @for (section of sections; track section.label) {
    <div>
      <button
        type="button"
        (click)="toggle(section.label)"
        class="flex w-full items-center justify-between rounded px-3 py-1.5 text-sm font-bold text-zinc-900 dark:text-zinc-100 hover:text-zinc-700 dark:hover:text-zinc-300"
        [attr.aria-expanded]="isOpen(section.label)"
      >
        {{ section.label }}
        <svg
          [lucideIcon]="chevron"
          class="size-4 transition-transform"
          [class]="isOpen(section.label) ? '' : '-rotate-90'"
        ></svg>
      </button>
      @if (isOpen(section.label)) {
        <ul class="mt-1 flex flex-col gap-1">
          @for (item of section.items; track item.href) {
            <li>
              <a
                [routerLink]="item.href"
                routerLinkActive="bg-[color:var(--accent-soft)]! text-[color:var(--accent-strong)]! font-medium"
                [routerLinkActiveOptions]="{exact: true}"
                ariaCurrentWhenActive="page"
                class="flex items-center justify-between gap-2 rounded-md px-3 py-1.5 text-zinc-700 dark:text-brand-muted-dark hover:bg-[color:var(--accent-soft)] hover:text-[color:var(--accent-strong)] focus:outline-none focus-visible:outline-2 focus-visible:outline focus-visible:outline-offset-[-2px] focus-visible:outline-[color:var(--accent)]"
              >
                <span class="min-w-0 truncate">{{ item.label }}</span>
                @if (item.status; as status) {
                  <span
                    class="inline-flex items-center rounded-full px-1.5 py-0.5 text-[0.625rem] font-medium uppercase tracking-wider"
                    [class]="statusClass(status)"
                    >{{ status }}</span
                  >
                }
              </a>
            </li>
          }
        </ul>
      }
    </div>
  }
  @if (sponsorUrl) {
    <a
      [href]="sponsorUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center gap-2 rounded-md px-3 py-1.5 text-zinc-700 dark:text-brand-muted-dark hover:bg-[color:var(--accent-soft)] hover:text-[color:var(--accent-strong)]"
    >
      <svg [lucideIcon]="heart" class="size-4 text-[color:var(--accent-strong)]"></svg>
      Sponsor
    </a>
  }
</nav>
