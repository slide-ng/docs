@if (content$ | async; as doc) {
  @if (doc.content === notFound) {
    <section
      class="mx-auto max-w-xl w-full px-6 py-16 text-center flex flex-col items-center justify-center min-h-[calc(100vh-12rem)]"
    >
      <img src="brand/mark-color.svg" alt="" aria-hidden="true" class="mx-auto mb-6 size-16" />
      <p class="text-sm font-medium tracking-[0.2em] text-brand-muted dark:text-brand-muted-dark">
        404
      </p>
      <h1 class="mt-3 text-3xl sm:text-4xl font-bold tracking-tight">Page not found</h1>
      <p class="mt-4 text-base text-brand-muted dark:text-brand-muted-dark">
        The page you're looking for doesn't exist or has moved.
      </p>

      @if (suggestion(); as hit) {
        <button
          type="button"
          (click)="gotoHit(hit)"
          class="mt-8 w-full max-w-sm flex items-center gap-3 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 px-4 py-3 text-left hover:bg-[color:var(--accent-soft)] hover:text-[color:var(--accent-strong)] hover:border-transparent transition-colors"
        >
          <span class="flex-1 min-w-0">
            <span
              class="block text-[0.625rem] uppercase tracking-[0.2em] text-brand-muted dark:text-brand-muted-dark"
            >
              Maybe you meant
            </span>
            <span class="mt-1 block text-sm font-medium truncate">{{
              stripMarkup(hit.labelHtml)
            }}</span>
          </span>
          <svg [lucideIcon]="arrowIcon" class="size-4 text-zinc-400 shrink-0"></svg>
        </button>
      }

      <div class="mt-8 flex items-center justify-center gap-2 whitespace-nowrap">
        <button
          type="button"
          (click)="searchInPalette()"
          class="inline-flex items-center gap-2 rounded-md bg-zinc-900 dark:bg-zinc-50 px-4 py-2 text-sm font-medium text-zinc-50 dark:text-zinc-900 hover:bg-zinc-700 dark:hover:bg-zinc-200"
        >
          <svg [lucideIcon]="searchIcon" class="size-4"></svg>
          Search the docs
        </button>
        <a
          routerLink="/"
          class="rounded-md border border-zinc-200 dark:border-zinc-800 px-4 py-2 text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-900"
        >
          Go home
        </a>
      </div>
    </section>
  } @else {
    <article class="max-w-3xl mx-auto pt-8 px-8 pb-4">
      <analog-markdown [content]="doc.content" />
    </article>
  }
}
